<!DOCTYPE html>
<html lang="mr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login | Vitthal Mobile Shop</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Existing Style CSS -->
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">

  <!-- Full page wrapper for centered login card -->
  <div class="auth-wrapper">
    
    <!-- Background glowing effect -->
    <div class="hero-glow auth-glow"></div>

    <div class="auth-card">
      
      <!-- Logo & Header -->
      <div class="auth-header">
        <div class="brand-icon auth-icon">
          <i class="fa-solid fa-lock"></i>
        </div>
        <h1 class="auth-title">Vitthal Mobile Shop</h1>
        <p class="auth-subtitle">Admin & Staff Control Panel</p>
      </div>

      <!-- Alert / Error Message Box -->
      <div id="authErrorMsg" class="auth-alert" style="display: none;">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="authErrorText">चुकीचा Email किंवा Password!</span>
      </div>

      <!-- Login Form -->
      <form id="adminLoginForm" onsubmit="handleAdminLogin(event)" novalidate>
        
        <!-- Email Field -->
        <div class="form-group">
          <label for="adminEmail" class="form-label">Admin Email</label>
          <div class="input-wrap">
            <i class="fa-solid fa-envelope input-icon"></i>
            <input 
              type="email" 
              id="adminEmail" 
              class="form-input" 
              placeholder="admin@vitthalmobile.com" 
              required 
              autocomplete="email"
            >
          </div>
        </div>

        <!-- Password Field -->
        <div class="form-group">
          <label for="adminPassword" class="form-label">Password</label>
          <div class="input-wrap">
            <i class="fa-solid fa-key input-icon"></i>
            <input 
              type="password" 
              id="adminPassword" 
              class="form-input" 
              placeholder="तुमचा पासवर्ड टाका" 
              required 
              autocomplete="current-password"
            >
            <button 
              type="button" 
              class="password-toggle-btn" 
              id="passwordToggleBtn" 
              onclick="togglePasswordVisibility()" 
              title="Show/Hide Password"
              tabindex="-1"
            >
              <i class="fa-solid fa-eye" id="toggleEyeIcon"></i>
            </button>
          </div>
        </div>

        <!-- Login Button with Spinner -->
        <button type="submit" id="loginSubmitBtn" class="btn btn-primary auth-btn">
          <span class="btn-text">लॉगिन करा (Login)</span>
          <div class="btn-spinner" id="btnSpinner" style="display: none;"></div>
        </button>

      </form>

      <!-- Back to Shop Link -->
      <div class="auth-footer">
        <a href="index.html" class="back-link">
          <i class="fa-solid fa-arrow-left"></i> मुख्य वेबसाईटवर परत जा
        </a>
      </div>

    </div>
  </div>

  <!-- Firebase SDKs (App + Auth Compat) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

  <!-- Admin Login JS -->
  <script src="admin-login.js"></script>
</body>
</html>
